name: Rome meteogram

on:
  schedule:
    # every day at 08:30 UTC = 09:30 in Rome in winter, 10:30 in summer
    # (MOLOCH and BOLAM of the day are published around 08:00-08:30 UTC)
    - cron: "30 8 * * *"
  workflow_dispatch:        # "Run workflow" button, to make one now

permissions:
  contents: write           # to save the meteogram in the repository

concurrency:
  group: meteogram
  cancel-in-progress: false

jobs:
  meteogram:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Make the meteogram (next 15 hours)
        run: python meteogram.py --hours 15 --out meteograms --keep 14

      - name: Save it in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A meteograms README.md
          git commit -m "Meteogram $(TZ=Europe/Rome date +'%Y-%m-%d %H:%M')" || exit 0
          git push
